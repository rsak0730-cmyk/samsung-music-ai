name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Clean existing Capacitor setup
        run: |
          rm -rf android
          rm -f capacitor.config.json

      - name: Initialize Capacitor
        run: |
          npx cap init "Samsung Music AI" "com.samsung.music.ai" --web-dir www
          npx cap add android

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=256m
          org.gradle.parallel=false
          org.gradle.workers.max=1
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.caching=false
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --no-build-cache -Dorg.gradle.unsafe.instant-execution=false

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
