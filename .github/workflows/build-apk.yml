name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Initialize Capacitor & Add Android Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Samsung Music AI" "com.samsung.music.ai" --web-dir www
          npx cap add android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Clear Gradle Cache Completely
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf ~/.gradle/notifications/
          rm -rf ~/.gradle/gradle.properties
          rm -rf ~/.gradle/jdks/

      - name: Create gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" > ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=4" >> ~/.gradle/gradle.properties

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
