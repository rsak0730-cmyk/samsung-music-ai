name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Initialize Capacitor & Add Android Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Samsung Music AI" "com.samsung.music.ai" --web-dir www
          npx cap add android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Cache intentionally disabled here to prevent restoring corrupted files

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Build Debug APK with Gradle
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3200m -Dorg.gradle.daemon=false"
        run: |
          chmod +x gradlew
          rm -rf ~/.gradle/caches/
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
