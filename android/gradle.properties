# Gradle properties for Samsung Music AI
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=false

# Android
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdkWarning=true
android.enableResourceValidation=true
android.enableOnDemandConfiguration=false
android.disableDependencyValidation=true

# Disable features that slow down builds
org.gradle.daemon=true
org.gradle.parallel.threads=4
